<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle border outline -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="url(#primary)" stroke-width="6" opacity="0.4"/>

  <!-- Glowing Hexagon / Nova Core -->
  <g transform="translate(256, 256)">
    <!-- Circuit lines -->
    <circle r="180" fill="none" stroke="#1e293b" stroke-width="3" stroke-dasharray="12 16" opacity="0.8"/>
    <circle r="140" fill="none" stroke="url(#primary)" stroke-width="2" opacity="0.3"/>
    
    <!-- Outer Glow -->
    <path d="M 0,-150 L 130,-75 L 130,75 L 0,150 L -130,75 L -130,-75 Z" fill="url(#primary)" opacity="0.15" filter="url(#glow)"/>
    
    <!-- Central Hexagonal Tech Shield -->
    <path d="M 0,-130 L 112,-65 L 112,65 L 0,130 L -112,65 L -112,-65 Z" fill="#0f172a" stroke="url(#primary)" stroke-width="8"/>

    <!-- Dynamic Bolt & "E" Symbol -->
    <path d="M 15,-90 L -55,-5 L 5,-5 L -25,90 L 65,-5 L 5,-5 Z" fill="url(#primary)" filter="url(#glow)"/>
    
    <!-- Small tech spark / dot -->
    <circle cx="55" cy="-55" r="8" fill="url(#accent)"/>
    <circle cx="-55" cy="55" r="5" fill="#38bdf8"/>
  </g>
</svg>
